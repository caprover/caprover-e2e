name: CapRover E2E - Git Webhooks

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: caprover-e2e-git-webhooks
    cancel-in-progress: false

jobs:
    git-webhooks:
        runs-on: ubuntu-latest
        timeout-minutes: 55
        env:
            DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
            DIGITALOCEAN_SSH_KEY_ID: ${{ secrets.DIGITALOCEAN_SSH_KEY_ID }}
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
            E2E_BASE_DOMAIN: ${{ secrets.E2E_BASE_DOMAIN }}
            CAPROVER_E2E_SSH_PRIVATE_KEY: ${{ secrets.CAPROVER_E2E_SSH_PRIVATE_KEY }}
            E2E_GIT_HTTPS_REPO: ${{ secrets.E2E_GIT_HTTPS_REPO }}
            E2E_GIT_SSH_REPO: ${{ secrets.E2E_GIT_SSH_REPO }}
            E2E_GIT_BRANCH: ${{ secrets.E2E_GIT_BRANCH }}
            E2E_GIT_HTTP_USER: ${{ secrets.E2E_GIT_HTTP_USER }}
            E2E_GIT_HTTP_PASSWORD: ${{ secrets.E2E_GIT_HTTP_PASSWORD }}
            E2E_GIT_SSH_PRIVATE_KEY: ${{ secrets.E2E_GIT_SSH_PRIVATE_KEY }}
            E2E_GIT_EXPECTED_COMMIT: ${{ secrets.E2E_GIT_EXPECTED_COMMIT }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Validate prerequisites before provisioning
              run: node scripts/check-git-fixture.mjs

            - name: Install dependencies
              timeout-minutes: 5
              run: npm ci

            - name: Provision fresh CapRover server
              timeout-minutes: 30
              run: npm run provision

            - name: Test Git webhooks
              timeout-minutes: 12
              run: npm run typecheck && npm run test:git-webhooks

            # Generic diagnostics include unredacted captain build logs, which
            # can contain the authenticated Git remote after clone failures.
            - name: Destroy temporary infrastructure
              if: always()
              timeout-minutes: 5
              run: npm run destroy
