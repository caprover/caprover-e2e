name: CapRover E2E - Fresh Server

on:
    workflow_dispatch:
        inputs:
            suite:
                description: Test suite
                type: choice
                required: true
                default: default
                options:
                    - default
                    - git-webhooks

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 55
        env:
            DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
            DIGITALOCEAN_SSH_KEY_ID: ${{ secrets.DIGITALOCEAN_SSH_KEY_ID }}
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
            E2E_BASE_DOMAIN: ${{ secrets.E2E_BASE_DOMAIN }}
            CAPROVER_E2E_SSH_PRIVATE_KEY: ${{ secrets.CAPROVER_E2E_SSH_PRIVATE_KEY }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            # This workflow already exists on main, so the branch's specialized
            # suite can be dispatched and validated before its new workflow merges.
            - name: Validate Git fixture before provisioning
              if: inputs.suite == 'git-webhooks'
              env:
                  E2E_GIT_HTTPS_REPO: ${{ secrets.E2E_GIT_HTTPS_REPO }}
                  E2E_GIT_SSH_REPO: ${{ secrets.E2E_GIT_SSH_REPO }}
                  E2E_GIT_BRANCH: ${{ secrets.E2E_GIT_BRANCH }}
                  E2E_GIT_HTTP_USER: ${{ secrets.E2E_GIT_HTTP_USER }}
                  E2E_GIT_HTTP_PASSWORD: ${{ secrets.E2E_GIT_HTTP_PASSWORD }}
                  E2E_GIT_SSH_PRIVATE_KEY: ${{ secrets.E2E_GIT_SSH_PRIVATE_KEY }}
                  E2E_GIT_EXPECTED_COMMIT: ${{ secrets.E2E_GIT_EXPECTED_COMMIT }}
              run: node scripts/check-git-fixture.mjs

            - name: Install dependencies
              timeout-minutes: 5
              run: npm ci

            - name: Provision fresh CapRover server
              timeout-minutes: 30
              run: npm run provision

            - name: Run E2E suite
              id: e2e
              if: inputs.suite != 'git-webhooks'
              timeout-minutes: 15
              run: npm test

            - name: Test Git webhooks
              if: inputs.suite == 'git-webhooks'
              timeout-minutes: 12
              env:
                  E2E_GIT_HTTPS_REPO: ${{ secrets.E2E_GIT_HTTPS_REPO }}
                  E2E_GIT_SSH_REPO: ${{ secrets.E2E_GIT_SSH_REPO }}
                  E2E_GIT_BRANCH: ${{ secrets.E2E_GIT_BRANCH }}
                  E2E_GIT_HTTP_USER: ${{ secrets.E2E_GIT_HTTP_USER }}
                  E2E_GIT_HTTP_PASSWORD: ${{ secrets.E2E_GIT_HTTP_PASSWORD }}
                  E2E_GIT_SSH_PRIVATE_KEY: ${{ secrets.E2E_GIT_SSH_PRIVATE_KEY }}
                  E2E_GIT_EXPECTED_COMMIT: ${{ secrets.E2E_GIT_EXPECTED_COMMIT }}
              run: npm run typecheck && npm run test:git-webhooks

            - name: Collect failure diagnostics
              if: failure() && steps.e2e.outcome == 'failure'
              continue-on-error: true
              timeout-minutes: 3
              run: npm run diagnose

            - name: Destroy temporary infrastructure
              if: always()
              timeout-minutes: 5
              run: npm run destroy
